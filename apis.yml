aid: rollbar
url: https://raw.githubusercontent.com/api-evangelist/rollbar/refs/heads/main/apis.yml
modified: '2026-03-20'
apis:
  - aid: rollbar:rest-api
    name: Rollbar REST API
    tags:
      - Error Tracking
      - Monitoring
      - Occurrences
      - Items
      - Projects
      - Deploys
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.rollbar.com
    humanURL: https://docs.rollbar.com/reference/getting-started-1
    properties:
      - url: https://docs.rollbar.com/reference/getting-started-1
        type: Documentation
      - url: openapi/rollbar-rest-api-openapi.yml
        type: OpenAPI
    description: >-
      The Rollbar REST API provides programmatic access to the Rollbar error
      tracking and monitoring platform. It allows developers to manage projects,
      items, occurrences, deploys, teams, users, and invites through a RESTful
      JSON interface. Authentication is handled via access tokens passed in the
      X-Rollbar-Access-Token header. The API is used by Rollbar's official SDKs
      to report errors and exceptions, and can also be used to build custom
      integrations, extract data for analysis, or automate workflows around
      error management.
  - aid: rollbar:metrics-api
    name: Rollbar Metrics API
    tags:
      - Metrics
      - Analytics
      - Error Tracking
      - Monitoring
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.rollbar.com
    humanURL: https://docs.rollbar.com/docs/metrics-api-examples
    properties:
      - url: https://docs.rollbar.com/docs/metrics-api-examples
        type: Documentation
      - url: openapi/rollbar-metrics-api-openapi.yml
        type: OpenAPI
    description: >-
      The Rollbar Metrics API is part of Rollbar Analyze and provides
      programmatic access to metrics data for error tracking analysis and
      discovery. It enables developers to query resolution time metrics,
      occurrence counts, and other aggregate data across projects. The API
      supports filtering and grouping of results, making it useful for
      building dashboards, generating reports, and monitoring error trends
      over time.
  - aid: rollbar:rql-api
    name: Rollbar RQL API
    tags:
      - Query Language
      - Analytics
      - Error Tracking
      - SQL
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.rollbar.com
    humanURL: https://docs.rollbar.com/docs/rql
    properties:
      - url: https://docs.rollbar.com/docs/rql
        type: Documentation
      - url: openapi/rollbar-rql-api-openapi.yml
        type: OpenAPI
    description: >-
      The Rollbar RQL (Rollbar Query Language) API provides a SQL-like interface
      for querying error and deployment data stored in Rollbar. It supports
      SELECT queries against two logical tables: item_occurrence and deploy,
      allowing developers to perform complex filtering, grouping, and analysis
      of error data. RQL jobs can be submitted and retrieved via the API endpoint
      at /api/1/rql/jobs/, enabling programmatic access to advanced analytics
      that go beyond the standard REST API capabilities.
  - aid: rollbar:deployment-api
    name: Rollbar Deployment API
    tags:
      - Deployments
      - CI/CD
      - Release Management
      - Error Tracking
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.rollbar.com
    humanURL: https://docs.rollbar.com/docs/deployment-api
    properties:
      - url: https://docs.rollbar.com/docs/deployment-api
        type: Documentation
      - url: openapi/rollbar-deployment-api-openapi.yml
        type: OpenAPI
    description: >-
      The Rollbar Deployment API allows developers to notify Rollbar of
      application deployments and releases. By reporting deploys, teams can
      correlate error spikes with specific releases, track which code version
      introduced a bug, and automatically resolve items that were fixed in a
      deploy. The API accepts deployment metadata such as revision, environment,
      and rollbar_username, and integrates with CI/CD pipelines to provide
      continuous visibility into how deployments affect application stability.
  - aid: rollbar:webhooks
    name: Rollbar Webhooks
    tags:
      - Webhooks
      - Events
      - Notifications
      - Error Tracking
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.rollbar.com
    humanURL: https://docs.rollbar.com/docs/webhooks
    properties:
      - url: https://docs.rollbar.com/docs/webhooks
        type: Documentation
      - url: asyncapi/rollbar-webhooks-asyncapi.yml
        type: AsyncAPI
    description: >-
      Rollbar's webhook notification system delivers real-time event
      notifications to configured endpoints when errors, deployments, and
      other significant events occur. Webhooks support events including new
      items, every occurrence, exponential repeat items, high occurrence rate,
      item resolved, item reactivated, item reopened, and deploy events.
      Payloads are delivered via HTTP POST in JSON or XML format with
      automatic retry and exponential backoff on failure.
common:
  - type: JSON-LD
    url: json-ld/rollbar-context.jsonld
  - type: JSONSchema
    url: json-schema/rollbar-item-schema.json
  - type: JSONSchema
    url: json-schema/rollbar-occurrence-schema.json
  - type: JSONSchema
    url: json-schema/rollbar-deploy-schema.json
  - type: JSONSchema
    url: json-schema/rollbar-webhook-payload-schema.json
