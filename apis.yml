name: Rollbar
description: >-
  Rollbar is a real-time error tracking and monitoring platform for software teams. It automatically captures exceptions
  and errors from web, mobile, and server-side applications, groups them by root cause, and provides actionable alerts
  to speed up debugging. Rollbar provides SDKs for over a dozen platforms including JavaScript, Python, PHP, Ruby, Go,
  Swift, .NET, and Java. The REST API enables programmatic management of projects, items, occurrences, deployments,
  teams, notifications, and source maps. The RQL (Rollbar Query Language) provides SQL-like queries for error analysis.
type: Index
