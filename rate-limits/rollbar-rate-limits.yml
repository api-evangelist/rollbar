specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Rollbar
providerId: rollbar
created: '2026-05-04'
modified: '2026-05-04'
reconciled: true
tags:
  - Rate Limiting
  - Error Monitoring
description: Rollbar API rate limits per project.
sources:
  - https://rollbar.com/pricing/
  - https://docs.rollbar.com/reference/rate-limits
headers:
  limit: X-Rate-Limit-Limit
  remaining: X-Rate-Limit-Remaining
  reset: X-Rate-Limit-Remaining-Seconds
responseCodes:
  throttled: 429
limits:
  - name: Item ingest
    scope: project
    metric: items_per_minute
    limit: tier-based
  - name: REST API (read)
    scope: project
    metric: requests_per_minute
    limit: 5000
    timeFrame: minute
  - name: Bulk Resolve API
    scope: project
    metric: items_per_request
    limit: 1000
    timeFrame: request
