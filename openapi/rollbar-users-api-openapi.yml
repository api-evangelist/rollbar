openapi: 3.2.0
info:
  title: Rollbar REST Users API
  description: The Rollbar REST API provides programmatic access to the Rollbar error tracking and monitoring platform.
  version: '1'
  contact:
    name: Rollbar Support
    url: https://rollbar.com/support/
  termsOfService: https://rollbar.com/terms/
servers:
- url: https://api.rollbar.com/api/1
  description: Production Server
security:
- accessToken: []
tags:
- name: Users
  description: Retrieve user information within a Rollbar account.
paths:
  /users:
    get:
      operationId: listAllUsers
      summary: List All Users
      description: Returns all users in the account. Requires an account-level access token.
      tags:
      - Users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Unauthorized
  /user/{userId}:
    get:
      operationId: getUser
      summary: Get a User
      description: Returns information about a specific user by their user ID.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
        '404':
          description: User not found
components:
  schemas:
    User:
      type: object
      description: A user in a Rollbar account.
      properties:
        id:
          type: integer
          description: The user ID.
        username:
          type: string
          description: The username.
        email:
          type: string
          description: The user's email address.
          format: email
    UserListResponse:
      type: object
      properties:
        err:
          type: integer
          description: Error code. 0 indicates success.
        result:
          type: object
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/User'
    UserResponse:
      type: object
      properties:
        err:
          type: integer
          description: Error code. 0 indicates success.
        result:
          $ref: '#/components/schemas/User'
  parameters:
    UserIdParam:
      name: userId
      in: path
      required: true
      description: The ID of the user.
      schema:
        type: integer
  securitySchemes:
    accessToken:
      type: apiKey
      in: header
      name: X-Rollbar-Access-Token
      description: Rollbar access token for authentication. Different token scopes are required for different operations.
externalDocs:
  description: Rollbar API Documentation
  url: https://docs.rollbar.com/reference/getting-started-1
