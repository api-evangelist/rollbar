naftiko: 1.0.0-alpha2
info:
  label: Rollbar REST API — Users
  description: 'Rollbar REST API — Users. 2 operations. Lead operation: Get a User. Self-contained Naftiko capability covering
    one Rollbar business surface.'
  tags:
  - Rollbar
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ROLLBAR_API_KEY: ROLLBAR_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-users
    baseUri: https://api.rollbar.com/api/1
    description: Rollbar REST API — Users business capability. Self-contained, no shared references.
    resources:
    - name: user-userId
      path: /user/{userId}
      operations:
      - name: getuser
        method: GET
        description: Get a User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users
      path: /users
      operations:
      - name: listallusers
        method: GET
        description: List All Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Rollbar-Access-Token
      value: '{{env.ROLLBAR_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-users-rest
    port: 8080
    description: REST adapter for Rollbar REST API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/user/{userid}
      name: user-userid
      description: REST surface for user-userId.
      operations:
      - method: GET
        name: getuser
        description: Get a User
        call: rest-users.getuser
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: listallusers
        description: List All Users
        call: rest-users.listallusers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rollbar REST API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-user
      description: Get a User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-users.getuser
      outputParameters:
      - type: object
        mapping: $.
    - name: list-all-users
      description: List All Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-users.listallusers
      outputParameters:
      - type: object
        mapping: $.
