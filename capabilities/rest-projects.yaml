naftiko: 1.0.0-alpha2
info:
  label: Rollbar REST API — Projects
  description: 'Rollbar REST API — Projects. 4 operations. Lead operation: Get a Project. Self-contained Naftiko capability
    covering one Rollbar business surface.'
  tags:
  - Rollbar
  - Projects
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ROLLBAR_API_KEY: ROLLBAR_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-projects
    baseUri: https://api.rollbar.com/api/1
    description: Rollbar REST API — Projects business capability. Self-contained, no shared references.
    resources:
    - name: project-projectId
      path: /project/{projectId}
      operations:
      - name: getproject
        method: GET
        description: Get a Project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteproject
        method: DELETE
        description: Delete a Project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects
      path: /projects
      operations:
      - name: listallprojects
        method: GET
        description: List All Projects
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createproject
        method: POST
        description: Create a Project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-Rollbar-Access-Token
      value: '{{env.ROLLBAR_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-projects-rest
    port: 8080
    description: REST adapter for Rollbar REST API — Projects. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/project/{projectid}
      name: project-projectid
      description: REST surface for project-projectId.
      operations:
      - method: GET
        name: getproject
        description: Get a Project
        call: rest-projects.getproject
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteproject
        description: Delete a Project
        call: rest-projects.deleteproject
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects
      name: projects
      description: REST surface for projects.
      operations:
      - method: GET
        name: listallprojects
        description: List All Projects
        call: rest-projects.listallprojects
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createproject
        description: Create a Project
        call: rest-projects.createproject
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-projects-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rollbar REST API — Projects. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-project
      description: Get a Project
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-projects.getproject
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-project
      description: Delete a Project
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: rest-projects.deleteproject
      outputParameters:
      - type: object
        mapping: $.
    - name: list-all-projects
      description: List All Projects
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-projects.listallprojects
      outputParameters:
      - type: object
        mapping: $.
    - name: create-project
      description: Create a Project
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-projects.createproject
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
