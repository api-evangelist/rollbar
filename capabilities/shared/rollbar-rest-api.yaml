naftiko: "1.0.0-alpha1"

info:
  label: "Rollbar REST API"
  description: >-
    The Rollbar REST API provides programmatic access to the Rollbar error
    tracking and monitoring platform. Manage projects, items, occurrences,
    deploys, teams, users, invites, notifications, and source maps.
  tags:
    - Error Tracking
    - Monitoring
    - REST
    - DevOps
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      ROLLBAR_ACCESS_TOKEN: ROLLBAR_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: rollbar
      baseUri: https://api.rollbar.com/api/1
      description: "Rollbar REST API for error tracking and project management"
      authentication:
        type: apikey
        key: X-Rollbar-Access-Token
        value: "{{ROLLBAR_ACCESS_TOKEN}}"
        placement: header
      resources:
        - name: items
          path: /items/
          description: "Manage error and message items tracked by Rollbar"
          operations:
            - name: create-item
              method: POST
              description: "Report an error or message to Rollbar"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  payload: "{{tools.payload}}"

            - name: list-all-items
              method: GET
              description: "Returns all items in the project ordered by most recent occurrence"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by status (active, resolved, muted)"
                - name: level
                  in: query
                  type: string
                  required: false
                  description: "Filter by level (debug, info, warning, error, critical)"
                - name: environment
                  in: query
                  type: string
                  required: false
                  description: "Filter by environment"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-item-by-id
              method: GET
              description: "Get an item by its Rollbar item ID"
              inputParameters:
                - name: itemId
                  in: path
                  type: integer
                  required: true
                  description: "Rollbar item ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: update-item
              method: PATCH
              description: "Update the status or assignee of an item"
              inputParameters:
                - name: itemId
                  in: path
                  type: integer
                  required: true
                  description: "Rollbar item ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  status: "{{tools.status}}"

        - name: occurrences
          path: /instances/
          description: "Retrieve individual occurrences of errors and messages"
          operations:
            - name: list-project-occurrences
              method: GET
              description: "List all occurrences in a project"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-occurrence
              method: GET
              description: "Get a single occurrence"
              inputParameters:
                - name: instanceId
                  in: path
                  type: integer
                  required: true
                  description: "Occurrence instance ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: projects
          path: /projects
          description: "Manage Rollbar projects"
          operations:
            - name: list-all-projects
              method: GET
              description: "Returns all projects in the account"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-project
              method: POST
              description: "Create a new Rollbar project"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"

            - name: get-project
              method: GET
              description: "Get details of a specific project"
              inputParameters:
                - name: projectId
                  in: path
                  type: integer
                  required: true
                  description: "Rollbar project ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: delete-project
              method: DELETE
              description: "Delete a Rollbar project"
              inputParameters:
                - name: projectId
                  in: path
                  type: integer
                  required: true
                  description: "Rollbar project ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: teams
          path: /teams
          description: "Manage teams and team membership"
          operations:
            - name: list-all-teams
              method: GET
              description: "Returns all teams in the account"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-team
              method: POST
              description: "Create a new team"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  access_level: "{{tools.access_level}}"

            - name: assign-user-to-team
              method: PUT
              description: "Add a user to a team"
              inputParameters:
                - name: teamId
                  in: path
                  type: integer
                  required: true
                  description: "Team ID"
                - name: userId
                  in: path
                  type: integer
                  required: true
                  description: "User ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: notifications
          path: /notifications/webhook
          description: "Manage webhook notification configuration"
          operations:
            - name: get-webhook-config
              method: GET
              description: "Get webhook notification configuration"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: list-webhook-rules
              method: GET
              description: "List all webhook notification rules"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: rollbar-api
      resources:
        - path: /v1/items
          name: items
          description: "Rollbar error item management"
          operations:
            - method: GET
              name: list-items
              description: "List all error items"
              call: "rollbar.list-all-items"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-item
              description: "Report a new error item"
              call: "rollbar.create-item"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/projects
          name: projects
          description: "Rollbar project management"
          operations:
            - method: GET
              name: list-projects
              description: "List all projects"
              call: "rollbar.list-all-projects"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-project
              description: "Create a project"
              call: "rollbar.create-project"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: rollbar-mcp
      transport: http
      tools:
        - name: list-items
          description: "List all error items in a Rollbar project"
          hints:
            readOnly: true
            openWorld: true
          call: "rollbar.list-all-items"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-item
          description: "Get a specific error item by ID"
          hints:
            readOnly: true
            openWorld: false
          call: "rollbar.get-item-by-id"
          with:
            itemId: "tools.itemId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-projects
          description: "List all Rollbar projects in the account"
          hints:
            readOnly: true
            openWorld: true
          call: "rollbar.list-all-projects"
          outputParameters:
            - type: object
              mapping: "$."
